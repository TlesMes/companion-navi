spring:
  application:
    name: navi-server
  threads:
    virtual:
      enabled: true   # 요청마다 가상 스레드 — 두뇌 스트림을 붙든 채 막혀도 된다(service.md §11)

navi:
  brain:
    vendor: ${NAVI_BRAIN_VENDOR:echo}       # echo | anthropic
    model: ${NAVI_BRAIN_MODEL:claude-haiku-4-5}
    max-tokens: 1024
    anthropic-api-key: ${ANTHROPIC_API_KEY:}

---
# 저장소. 로컬 기본값은 compose.yaml의 PostgreSQL이다.
spring:
  datasource:
    url: ${NAVI_DB_URL:jdbc:postgresql://localhost:5433/navi}
    username: ${NAVI_DB_USER:navi}
    password: ${NAVI_DB_PASSWORD:navi}
  docker:
    compose:
      lifecycle-management: start-only   # bootRun이 띄우되, 끝날 때 내리지 않는다(데이터 유지)

---
# 반응 턴의 한도(service.md §10, G7). 값은 임시다(D24) — 사용 로그가 쌓이면 다시 정한다.
navi:
  quota:
    max-text-chars: ${NAVI_QUOTA_MAX_TEXT_CHARS:500}
    turns-per-minute: ${NAVI_QUOTA_TURNS_PER_MINUTE:20}
    daily-tokens: ${NAVI_QUOTA_DAILY_TOKENS:300000}

spring:
  application:
    name: navi-server
  threads:
    virtual:
      enabled: true   # 요청마다 가상 스레드 — 두뇌 스트림을 붙든 채 막혀도 된다(service.md §11)

navi:
  brain:
    vendor: ${NAVI_BRAIN_VENDOR:echo}       # echo | anthropic
    model: ${NAVI_BRAIN_MODEL:claude-haiku-4-5}
    max-tokens: 1024
    anthropic-api-key: ${ANTHROPIC_API_KEY:}

---
# 저장소. 로컬 기본값은 compose.yaml의 PostgreSQL이다.
spring:
  datasource:
    url: ${NAVI_DB_URL:jdbc:postgresql://localhost:5433/navi}
    username: ${NAVI_DB_USER:navi}
    password: ${NAVI_DB_PASSWORD:navi}
  docker:
    compose:
      lifecycle-management: start-only   # bootRun이 띄우되, 끝날 때 내리지 않는다(데이터 유지)

---
# 반응 턴의 한도(service.md §10, G7). 값은 임시다(D24) — 사용 로그가 쌓이면 다시 정한다.
navi:
  quota:
    max-text-chars: ${NAVI_QUOTA_MAX_TEXT_CHARS:500}
    turns-per-minute: ${NAVI_QUOTA_TURNS_PER_MINUTE:20}
    daily-tokens: ${NAVI_QUOTA_DAILY_TOKENS:300000}

---
# 서버 기억(checklist G3). 값은 단독 모드 config.yaml memory.facts와 같다.
navi:
  facts:
    enabled: ${NAVI_FACTS_ENABLED:true}
    max-injected: 50
    min-new-user-turns: 4
    recent-rows-min: 8
  # 워커 API — Python 워커(python -m navi.worker)가 작업을 가져간다. 토큰이 비면 API가 닫힌다.
  worker:
    token: ${NAVI_WORKER_TOKEN:}

---
# 서비스 사용자에게 제공하는 페르소나(personas/<키>.yaml). 목록 밖의 카드는 모르는 페르소나다 —
# 시험용(zz_*)·로컬 전용 카드가 서비스로 새지 않게.
navi:
  personas:
    offered: ${NAVI_PERSONAS_OFFERED:navi,example_kr,example_jp}

---
# 연결 유지 — 서버가 ping을 보내고, 대답이 끊긴 연결은 닫는다(진행 중 턴은 폐기, D22).
navi:
  connection:
    ping-interval-ms: 20000
    pong-timeout-ms: 60000

---
# 본문 필드 암호화(G8 ②). 마스터 키가 없으면 서버가 뜨지 않는다. ./gradlew bootRun은 .env의
# NAVI_DATA_KEY를, 없으면 개발용 키를 넣어 준다(build.gradle).
navi:
  crypto:
    master-key: ${NAVI_DATA_KEY:}

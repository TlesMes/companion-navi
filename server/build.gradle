import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'navi'
version = '0.1.0'

java {
    // Virtual Threads(21+)가 전제다(service.md §11). 기본 java가 17이어도 빌드가 25를 찾아 쓴다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter'
    // 두뇌 벤더 SDK — 어댑터(brain/AnthropicBrain) 밖으로 타입이 새지 않게 한다.
    implementation 'com.anthropic:anthropic-java:3.8.0'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // JPA가 아니라 JdbcClient — 행 잠금(쿼터)과 SKIP LOCKED(큐, D25)를 SQL로 직접 쓴다.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // bootRun 때 compose.yaml의 PostgreSQL을 띄우고 접속 정보를 잡아 준다(로컬 개발 전용).
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'tools.jackson.core:jackson-databind'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // 공유 픽스처(tests/fixtures)와 카드(personas)는 저장소 루트에 있다 — Python과 같은 파일을 읽는다.
    systemProperty 'navi.repoRoot', rootDir.parentFile.absolutePath
    systemProperty 'file.encoding', 'UTF-8'
}

// 저장소 루트의 .env에서 키 하나를 읽는다(Python 쪽이 쓰는 그 파일). 값을 출력하지 않는다.
def dotenv = { String key ->
    def fromEnv = System.getenv(key)
    if (fromEnv) return fromEnv
    def file = new File(rootDir.parentFile, '.env')
    if (!file.exists()) return null
    def line = file.readLines('UTF-8').find { it.trim().startsWith(key + '=') }
    return line ? line.substring(line.indexOf('=') + 1).trim().replaceAll(/^["']|["']$/, '') : null
}

tasks.named('test') {
    // 실호출은 기본 테스트에서 뺀다 — 돈이 들고 네트워크가 필요하다.
    useJUnitPlatform { excludeTags 'live' }
}

// 실호출 스모크. 키는 환경 변수 또는 저장소 루트 .env의 ANTHROPIC_API_KEY.
//   ./gradlew liveTest
tasks.register('liveTest', Test) {
    description = '실제 두뇌 벤더를 부르는 스모크 테스트(과금)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    systemProperty 'navi.repoRoot', rootDir.parentFile.absolutePath
    systemProperty 'file.encoding', 'UTF-8'
    outputs.upToDateWhen { false }
    jvmArgs '-Dstdout.encoding=UTF-8'
    testLogging { showStandardStreams = true }
    doFirst {
        def key = dotenv('ANTHROPIC_API_KEY')
        if (!key) throw new GradleException('ANTHROPIC_API_KEY가 없습니다(환경 변수 또는 ../.env)')
        environment 'ANTHROPIC_API_KEY', key
    }
}

// 로컬 실행. 저장소 루트 .env에 ANTHROPIC_API_KEY가 있으면 넘겨준다(Python 쪽과 같은 키).
//   ./gradlew bootRun                                  # echo 두뇌 — 키 없이 배선 확인
//   NAVI_BRAIN_VENDOR=anthropic ./gradlew bootRun      # 실제 모델
tasks.named('bootRun') {
    doFirst {
        def key = dotenv('ANTHROPIC_API_KEY')
        if (key) environment 'ANTHROPIC_API_KEY', key
        // 워커 API 공유 비밀 — Python 워커(python -m navi.worker)도 같은 .env에서 읽는다.
        def workerToken = dotenv('NAVI_WORKER_TOKEN')
        if (workerToken) environment 'NAVI_WORKER_TOKEN', workerToken
        // 본문 암호화 마스터 키. 없으면 **개발용 고정 키**를 넣는다 — 로컬 DB 전용이다.
        // 이 키로 암호화한 DB를 운영에 쓰면 안 된다(키가 저장소에 공개돼 있다).
        def dataKey = dotenv('NAVI_DATA_KEY')
        if (!dataKey) {
            dataKey = 'bmF2aS1sb2NhbC1kZXYta2V5LU5PVC1BLVNFQ1JFVCE='
            logger.warn('NAVI_DATA_KEY가 없어 개발용 고정 키로 띄웁니다 — 로컬 전용')
        }
        environment 'NAVI_DATA_KEY', dataKey
    }
}
